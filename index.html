<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>

  </head>
  <body>
    <h1>Scrcpy Electron</h1>
    <div id="device-list-container">
      <h2>Connected Devices</h2>
      <button id="refresh-devices">Refresh</button>
      <ul id="device-list"></ul>
    </div>
    <div id="scrcpy-container" style="display: none;">
      <div id="scrcpy-header">
        <button id="back-to-list">Back</button>
        <span id="scrcpy-status">Connecting...</span>
        <div id="scrcpy-toolbar">
          <button id="btn-screenshot">Screenshot</button>
          <button id="btn-record">Start Record</button>
        </div>
      </div>
      <div id="scrcpy-error" style="color: #ff4444; margin: 10px; display: none;"></div>
      
      <div class="main-layout">
        <div class="video-container">
          <canvas id="scrcpy-canvas"></canvas>
        </div>
        <div id="agent-panel" class="agent-panel">
          <h3>Vision Agent</h3>
          <div id="agent-log" class="agent-log"></div>
          <div class="agent-input-container">
            <textarea id="agent-task-input" placeholder="Enter task (e.g., 'Open Settings and check about phone')"></textarea>
            <div class="agent-controls">
              <button id="btn-start-agent">Run Task</button>
              <button id="btn-stop-agent" style="background-color: #ff4444; display: none;">Stop Task</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
